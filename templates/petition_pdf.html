<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Dilekçe</title>
<style>
  /* Sade dilekçe çıktısı — antet, logo veya firma bilgisi yok. */
  @page { size: A4; margin: 25mm 22mm 20mm 22mm; }
  body {
    font-family: "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 11.5pt; line-height: 1.95; color: #111; margin: 0;
  }
  .body-text { white-space: pre-wrap; text-align: justify; }
  .sign-block {
    margin-top: 26pt; page-break-inside: avoid;
    display: flex; justify-content: flex-end;
  }
  .sign-box { width: 68mm; text-align: center; }
  .sign-date { font-size: 10.5pt; margin-bottom: 2pt; }
  .sign-img { height: 26mm; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
  .sign-name { font-size: 11pt; margin-top: 1pt; }
</style>
</head>
<body>

<div class="body-text">{{ text }}</div>

<div class="sign-block">
  <div class="sign-box">
    <div class="sign-date">{% if place %}{{ place }}, {% endif %}{{ date_str }}</div>
    <img class="sign-img" src="{{ signature }}" alt="" />
    {% if signer %}<div class="sign-name">{{ signer }}</div>{% endif %}
  </div>
</div>

</body>
</html>
