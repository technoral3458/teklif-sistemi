<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş | B2B Teklif Sistemi</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .login-wrap { width:100%; max-width:440px; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo h1 { font-size:24px; font-weight:700; color:var(--accent); margin:0 0 4px; }
    .login-logo p  { font-size:13px; color:var(--text-muted); margin:0; }
    .login-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:32px; }
    .login-tabs { display:flex; gap:4px; margin-bottom:24px; background:var(--surface-2); border-radius:8px; padding:4px; }
    .login-tab-btn { flex:1; padding:8px; border:none; background:transparent; color:var(--text-muted);
      border-radius:6px; cursor:pointer; font-size:14px; font-weight:500; transition:all .2s; }
    .login-tab-btn.active { background:var(--accent); color:#fff; }
    .login-tab-pane { display:none; }
    .login-tab-pane.active { display:block; }
    .forgot-link { font-size:12px; color:var(--accent); cursor:pointer; text-decoration:none; display:inline-block; margin-top:8px; }
    .theme-switch { position:fixed; top:16px; right:16px; }
  </style>
</head>
<body>
  <button class="btn-icon theme-switch" onclick="toggleTheme()" id="themeToggleBtn" title="Tema Değiştir">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <div class="login-wrap">
    <div class="login-logo">
      <h1>B2B Teklif Sistemi</h1>
      <p>Kurumsal Satış &amp; Teklif Platformu</p>
    </div>

    {% if msg %}
    <div class="alert alert-{{ msg_type|default('info') }}" style="margin-bottom:16px;">
      {{ msg }}
      <button class="alert-close" onclick="this.parentElement.remove()" type="button">&times;</button>
    </div>
    {% endif %}

    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab-btn {% if tab != 'register' %}active{% endif %}" onclick="switchLoginTab('login')">Giriş Yap</button>
        <button class="login-tab-btn {% if tab == 'register' %}active{% endif %}" onclick="switchLoginTab('register')">Kayıt Ol</button>
      </div>

      <!-- Login Tab -->
      <div id="lt-login" class="login-tab-pane {% if tab != 'register' %}active{% endif %}">
        <form method="post" action="/auth/login">
          <div class="form-group">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" class="form-control" placeholder="ornek@firma.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Giriş Yap</button>
        </form>
        <div style="text-align:center;margin-top:12px;">
          <a class="forgot-link" onclick="openModal('forgotModal')">Şifremi Unuttum</a>
        </div>
      </div>

      <!-- Register Tab -->
      <div id="lt-register" class="login-tab-pane {% if tab == 'register' %}active{% endif %}">
        <form method="post" action="/auth/register">
          <div class="form-group">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" class="form-control" placeholder="ornek@firma.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6" />
          </div>
          <div class="form-group">
            <label class="form-label">Firma Adı</label>
            <input type="text" name="company_name" class="form-control" placeholder="Firma A.Ş." required />
          </div>
          <div class="form-group">
            <label class="form-label">Telefon</label>
            <input type="tel" name="phone" class="form-control" placeholder="+90 5xx xxx xx xx" />
          </div>
          <div class="form-group">
            <label class="form-label">Hesap Tipi</label>
            <select name="user_type" class="form-control">
              <option value="dealer">Bayi</option>
              <option value="manufacturer">Üretici</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Kayıt Ol</button>
        </form>
        <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px;">
          Kayıt sonrası admin onayı gereklidir.
        </p>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Şifremi Unuttum</h3>
        <button class="modal-close" onclick="closeModal('forgotModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form method="post" action="/auth/forgot">
          <div class="form-group">
            <label class="form-label">E-posta Adresiniz</label>
            <input type="email" name="email" class="form-control" placeholder="ornek@firma.com" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Sıfırlama Kodu Gönder</button>
        </form>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Kodunuz varsa buradan şifrenizi sıfırlayın:</p>
          <form method="post" action="/auth/reset">
            <div class="form-group">
              <input type="email" name="email" class="form-control" placeholder="E-posta" required />
            </div>
            <div class="form-group">
              <input type="text" name="token" class="form-control" placeholder="6 haneli kod" required maxlength="6" />
            </div>
            <div class="form-group">
              <input type="password" name="new_password" class="form-control" placeholder="Yeni Şifre" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-success" style="width:100%">Şifreyi Sıfırla</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function switchLoginTab(tab) {
      document.querySelectorAll('.login-tab-pane').forEach(p => { p.classList.remove('active'); });
      document.querySelectorAll('.login-tab-btn').forEach(b => { b.classList.remove('active'); });
      document.getElementById('lt-' + tab).classList.add('active');
      event.currentTarget.classList.add('active');
    }
    // Apply theme on load
    (function(){
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</body>
</html>
