<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title data-i18n="pt_page_title">Dilekçe</title>
<link rel="stylesheet" href="/static/css/style.css" />
<style>
  body { min-height:100vh; padding:16px 14px 40px; }
  .pt-wrap { width:100%; max-width:720px; margin:0 auto; }
  .pt-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .pt-bar .lang { margin-left:auto; display:flex; gap:4px; }

  /* Kâğıt görünümlü metin alanı */
  .pt-paper {
    background:#fdfdfb; color:#15171a; border:1px solid #d8d8d2; border-radius:10px;
    box-shadow:0 10px 34px rgba(0,0,0,.35); padding:26px 24px;
  }
  .pt-paper textarea {
    width:100%; min-height:46vh; border:none; outline:none; resize:vertical;
    background:transparent; color:#15171a; font-family:Georgia,'Times New Roman',serif;
    font-size:16.5px; line-height:1.95; padding:0;
  }
  .pt-paper textarea::placeholder { color:#9b9b95; }
  .pt-meta { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;
             padding-top:16px; border-top:1px dashed #d8d8d2; }
  .pt-meta input {
    width:100%; border:none; border-bottom:1px solid #cfcfc8; background:transparent;
    color:#15171a; font-size:14px; padding:7px 2px; outline:none;
    font-family:Georgia,'Times New Roman',serif;
  }
  .pt-meta input::placeholder { color:#a6a6a0; }

  .pt-hint { font-size:12px; color:var(--text-muted); margin:10px 2px 0; line-height:1.6; }
  .pt-go { width:100%; margin-top:16px; min-height:50px; font-size:16px; font-weight:700;
           display:inline-flex; align-items:center; justify-content:center; gap:8px; }

  /* İmza katmanı */
  .pt-ov { position:fixed; inset:0; z-index:200; background:rgba(5,8,14,.78);
           display:none; align-items:flex-end; justify-content:center; padding:0; }
  .pt-ov.on { display:flex; }
  .pt-sheet { width:100%; max-width:720px; background:var(--surface);
              border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
              border:1px solid var(--border); border-bottom:none; }
  .pt-sheet h2 { font-size:17px; margin:0 0 4px; }
  .pt-sheet p  { font-size:12.5px; color:var(--text-muted); margin:0 0 12px; }
  .pt-pad-wrap { position:relative; }
  #ptPad { width:100%; height:230px; display:block; background:#fff;
           border:2px dashed #c9cdd6; border-radius:12px; touch-action:none; cursor:crosshair; }
  .pt-pad-line { position:absolute; left:26px; right:26px; bottom:52px; height:1px;
                 background:#d7dbe2; pointer-events:none; }
  .pt-pad-x { position:absolute; left:26px; bottom:56px; color:#b8bdc7; font-size:17px;
              pointer-events:none; font-family:Georgia,serif; }
  .pt-acts { display:flex; gap:8px; margin-top:14px; }
  .pt-acts .btn { flex:1; min-height:46px; justify-content:center; display:inline-flex;
                  align-items:center; font-size:15px; }

  /* Sonuç */
  .pt-done { display:none; text-align:center; }
  .pt-done.on { display:block; }
  .pt-done .ok { font-size:46px; line-height:1; }
  .pt-done h2 { font-size:19px; margin:12px 0 18px; }
  .pt-done .btn { width:100%; min-height:50px; margin-bottom:9px; font-size:15.5px;
                  justify-content:center; display:inline-flex; align-items:center; gap:8px; }
  .pt-wa { background:#25D366 !important; border-color:#25D366 !important; color:#06331a !important;
           font-weight:800 !important; }
  #ptBusy { display:none; text-align:center; color:var(--text-muted); font-size:14px;
            padding:26px 0; }
  #ptBusy.on { display:block; }
  @media (max-width:560px) { .pt-meta { grid-template-columns:1fr; } .pt-paper { padding:20px 16px; } }
</style>
</head>
<body>

<div class="pt-wrap">
  <div class="pt-bar">
    <a href="/login" class="btn btn-ghost btn-sm" data-i18n="pt_back">← Giriş Ekranı</a>
    <div class="lang">
      <button type="button" class="lang-btn" data-lang="tr" onclick="ptSetLang('tr')">🇹🇷 TR</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="ptSetLang('en')">🇬🇧 EN</button>
      <button type="button" class="lang-btn" data-lang="zh" onclick="ptSetLang('zh')">🇨🇳 中文</button>
    </div>
  </div>

  <!-- ── Yazma ── -->
  <div id="ptStepWrite">
    <div class="pt-paper">
      <textarea id="ptText" maxlength="{{ max_text }}" data-i18n-ph="pt_text_ph"
                placeholder="Dilekçe metnini buraya yazın…"></textarea>
      <div class="pt-meta">
        <input type="text" id="ptSigner" data-i18n-ph="pt_signer" placeholder="Ad Soyad (isteğe bağlı)" maxlength="120" />
        <input type="text" id="ptPlace" data-i18n-ph="pt_place" placeholder="Yer (isteğe bağlı)" maxlength="80" />
      </div>
    </div>
    <p class="pt-hint">
      <span data-i18n="pt_hint">Yazdığınız metin olduğu gibi PDF olur.</span>
      <span data-i18n="pt_nostore">Yazdığınız metin ve imzanız sunucuda saklanmaz.</span>
    </p>
    <button type="button" class="btn btn-primary pt-go" id="ptGo" onclick="ptOpenPad()">
      ✍️ <span data-i18n="pt_approve">Onayla ve İmzala</span>
    </button>
  </div>

  <!-- ── Hazır ── -->
  <div id="ptBusy"><span data-i18n="pt_preparing">PDF hazırlanıyor…</span></div>

  <div class="pt-done" id="ptDone">
    <div class="ok">✅</div>
    <h2 data-i18n="pt_ready">Dilekçeniz hazır</h2>
    <button type="button" class="btn pt-wa" id="ptWa" onclick="ptShare()">
      📲 <span data-i18n="pt_share_wa">WhatsApp’tan Gönder</span>
    </button>
    <a class="btn btn-outline" id="ptDl" download>
      ⬇ <span data-i18n="pt_download">PDF’i İndir</span>
    </a>
    <a class="btn btn-ghost" id="ptView" target="_blank">
      👁 <span data-i18n="pt_view">Önizle</span>
    </a>
    <button type="button" class="btn btn-ghost" onclick="ptBack()">
      ✏️ <span data-i18n="pt_edit">Metni Düzenle</span>
    </button>
  </div>
</div>

<!-- ── İmza katmanı ── -->
<div class="pt-ov" id="ptOv">
  <div class="pt-sheet">
    <h2 data-i18n="pt_sign_title">İmzanız</h2>
    <p data-i18n="pt_sign_hint">Parmağınızla veya kalemle aşağıdaki alana imzanızı atın.</p>
    <div class="pt-pad-wrap">
      <canvas id="ptPad"></canvas>
      <div class="pt-pad-line"></div>
      <div class="pt-pad-x">×</div>
    </div>
    <div class="pt-acts">
      <button type="button" class="btn btn-ghost" onclick="ptClear()"><span data-i18n="pt_clear">Temizle</span></button>
      <button type="button" class="btn btn-outline" onclick="ptClosePad()"><span data-i18n="pt_cancel">Vazgeç</span></button>
      <button type="button" class="btn btn-primary" onclick="ptSubmit()"><span data-i18n="pt_confirm">Onayla</span></button>
    </div>
  </div>
</div>

<script>
// ══ Dil ══
var PT_I18N = {{ i18n|tojson }};
var ptLang = 'tr';
function ptT(k) { var d = PT_I18N[ptLang] || PT_I18N.tr || {}; return d[k] !== undefined ? d[k] : k; }
function ptApply(l) {
  ptLang = PT_I18N[l] ? l : 'tr';
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var v = ptT(el.getAttribute('data-i18n')); if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    var v = ptT(el.getAttribute('data-i18n-ph')); if (v) el.placeholder = v;
  });
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.lang === ptLang);
  });
  document.documentElement.lang = ptLang === 'zh' ? 'zh-CN' : ptLang;
  try { document.title = ptT('pt_page_title'); } catch (e) {}
}
function ptSetLang(l) { try { localStorage.setItem('lang', l); } catch (e) {} ptApply(l); }
(function () { var l = 'tr'; try { l = localStorage.getItem('lang') || 'tr'; } catch (e) {} ptApply(l); })();

// ══ İmza pedi — mavi kalem ══
var pad = document.getElementById('ptPad'), ctx = pad.getContext('2d');
var drawing = false, hasInk = false, lastX = 0, lastY = 0, lastW = 3.0, lastT = 0;
var midX = 0, midY = 0;   // önceki orta nokta — çizginin sürekli olması için
var INK = '#14309c';

function ptFitPad() {
  var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  var data = hasInk ? pad.toDataURL() : null;
  pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  if (data) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = data; }
}
function ptPos(e) {
  var r = pad.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function ptStart(e) {
  drawing = true; var p = ptPos(e);
  lastX = p.x; lastY = p.y; midX = p.x; midY = p.y;
  lastT = Date.now(); lastW = 3.0;
  // Tek dokunuşta da iz kalsın
  ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = INK; ctx.fill(); hasInk = true;
  if (e.cancelable) e.preventDefault();
}
function ptMove(e) {
  if (!drawing) return;
  var p = ptPos(e), now = Date.now();
  var dx = p.x - lastX, dy = p.y - lastY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var dt = Math.max(1, now - lastT);
  // Hızlı çizgi inceldi, yavaş çizgi kalınlaştı — tükenmez kalem hissi
  var target = Math.max(1.6, Math.min(4.2, 4.2 - (dist / dt) * 2.4));
  var w = lastW + (target - lastW) * 0.35;
  var mx = (lastX + p.x) / 2, my = (lastY + p.y) / 2;
  // Önceki orta noktadan yenisine, aradaki nokta kontrol noktası:
  // parçalar uç uca eklenir, çizgi kesintisiz olur.
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(midX, midY);
  ctx.quadraticCurveTo(lastX, lastY, mx, my);
  ctx.stroke();
  midX = mx; midY = my;
  lastX = p.x; lastY = p.y; lastW = w; lastT = now; hasInk = true;
  if (e.cancelable) e.preventDefault();
}
function ptEnd() {
  if (drawing) {   // son yarım parçayı kapat
    ctx.beginPath(); ctx.moveTo(midX, midY); ctx.lineTo(lastX, lastY); ctx.stroke();
  }
  drawing = false;
}

pad.addEventListener('mousedown', ptStart);
pad.addEventListener('mousemove', ptMove);
window.addEventListener('mouseup', ptEnd);
pad.addEventListener('touchstart', ptStart, { passive: false });
pad.addEventListener('touchmove', ptMove, { passive: false });
pad.addEventListener('touchend', ptEnd);
window.addEventListener('resize', ptFitPad);

function ptClear() { ctx.clearRect(0, 0, pad.width, pad.height); hasInk = false; }
function ptOpenPad() {
  if (!document.getElementById('ptText').value.trim()) { alert(ptT('pt_err_empty')); return; }
  document.getElementById('ptOv').classList.add('on');
  setTimeout(ptFitPad, 30);
}
function ptClosePad() { document.getElementById('ptOv').classList.remove('on'); }

// ══ PDF üret + paylaş ══
var ptBlob = null, ptUrl = null;

function ptShow(id, on) { var e = document.getElementById(id); if (e) e.classList.toggle('on', !!on); }

async function ptSubmit() {
  if (!hasInk) { alert(ptT('pt_err_sig')); return; }
  var fd = new FormData();
  fd.append('text', document.getElementById('ptText').value);
  fd.append('signer', document.getElementById('ptSigner').value);
  fd.append('place', document.getElementById('ptPlace').value);
  fd.append('signature', pad.toDataURL('image/png'));
  fd.append('lang', ptLang);

  ptClosePad();
  document.getElementById('ptStepWrite').style.display = 'none';
  ptShow('ptBusy', true);
  try {
    var res = await fetch('/dilekce/pdf', { method: 'POST', body: fd });
    if (!res.ok) { throw new Error((await res.text()) || ptT('pt_err_pdf')); }
    ptBlob = await res.blob();
    if (ptUrl) URL.revokeObjectURL(ptUrl);
    ptUrl = URL.createObjectURL(ptBlob);
    document.getElementById('ptDl').href = ptUrl;
    document.getElementById('ptDl').download = 'dilekce.pdf';
    document.getElementById('ptView').href = ptUrl;
    ptShow('ptBusy', false);
    ptShow('ptDone', true);
  } catch (err) {
    ptShow('ptBusy', false);
    document.getElementById('ptStepWrite').style.display = '';
    alert(err.message || ptT('pt_err_pdf'));
  }
}

async function ptShare() {
  if (!ptBlob) return;
  var file = new File([ptBlob], 'dilekce.pdf', { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: ptT('pt_title') }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // Paylaşım yoksa: indir + WhatsApp'ı aç
  var a = document.getElementById('ptDl'); a.click();
  alert(ptT('pt_share_fallback'));
  window.open('https://wa.me/', '_blank');
}

function ptBack() {
  ptShow('ptDone', false);
  document.getElementById('ptStepWrite').style.display = '';
}
</script>
</body>
</html>
